[project]
name = "fremtpl2-pricing"
version = "0.1.0"
description = "Frequency-severity motor pricing on freMTPL2: GLMs, LightGBM benchmarks, pricing-strategy simulation and rating API"
authors = [
    { name = "Max-Isse", email = "59160619+Max-Isse@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=2.2,<3",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
fremtpl2 = "fremtpl2_pricing.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Report templates: deliberate typographic symbols (×, ν, −) and long Markdown lines.
"src/fremtpl2_pricing/reporting/*" = ["RUF001", "E501"]
