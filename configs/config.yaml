# Single source of truth for paths, thresholds and seeds.
# Every number used by the pipeline lives here; see docs/decisions.md for why each value was chosen.

seed: 20261029

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  duckdb: data/processed/fremtpl2.duckdb
  manifest: data/raw_manifest.json
  reports_dir: reports
  tables_dir: reports/tables
  figures_dir: reports/figures
  artifacts_dir: artifacts

openml:
  freq_id: 41214   # freMTPL2freq: one row per policy(-period), exposure and claim count
  sev_id: 41215    # freMTPL2sev: one row per claim with its amount

rating_factors:
  categorical: [Area, VehBrand, VehGas, Region]
  numeric: [VehPower, VehAge, DrivAge, BonusMalus, Density]

cleaning:
  exposure_cap: 1.0              # policy years; the portfolio is observed for one calendar year
  # "severity_records": claim count = number of claims with an amount record (keeps frequency and
  # severity consistent for pure premium). "recorded": keep ClaimNb as supplied.
  claim_count_source: severity_records
  claim_count_cap: 4             # counts above this are capped (see decisions.md D-004)
  large_loss_quantile: 0.995     # individual claims are capped at this quantile of claim amounts

split:
  holdout_fraction: 0.20
  n_folds: 5

glm:
  # Banded numeric factors: left-closed lower edges, last band open-ended (see decisions.md D-009).
  bands:
    DrivAge: [18, 21, 26, 31, 41, 51, 61, 71]
    VehAge: [0, 1, 3, 6, 10, 13, 16, 20]
    VehPower: [4, 5, 6, 7, 8, 9, 10, 12]
    BonusMalus: [50, 51, 58, 68, 80, 95, 100, 115]
    LogDensity: [0, 3, 4, 5, 6, 7, 8, 9]     # ln(Density)
  categorical: [VehBrand, VehGas, Region]
  factors: [DrivAge, VehAge, VehPower, BonusMalus, LogDensity, VehBrand, VehGas, Region, AgeMalus]
  # Fitted but not charged: pinned at the reference level when pricing (D-012).
  controls:
    ExposureBand:
      source: exposure
      edges: [0.0, 0.0833, 0.25, 0.5, 0.75, 0.999, 1.0]
      reference: "(0.999, 1]"              # full-year cover
  candidate_factors: [Area]                  # tested by LR test against the main model (add-one)
  derived:
    AgeMalus:                                # driver-age band x malus flag (D-011)
      age_cuts: [18, 31, 61]
      all_age_labels: ["18-30", "31-60", "61+"]
      age_labels: ["18-30", "61+"]           # 31-60 with a malus stays in the base level (identifiability)
      malus_threshold: 50
  ci_level: 0.95

frequency:
  baseline_one_factor: BonusMalus
  significance: 0.05
  residual_seed_offset: 1                    # added to the global seed for randomised quantile residuals
  residual_sample: 50000                     # residuals plotted on a sample to keep figures light

severity:
  # Coarser bands than frequency: ~25x fewer observations and far noisier outcomes (D-013).
  bands:
    DrivAge: [18, 26, 41, 61]
    VehAge: [0, 3, 10]
    VehPower: [4, 6, 8]
    BonusMalus: [50, 51, 80, 100]
    LogDensity: [0, 4, 6, 8]
  start_factors: [DrivAge, VehAge, VehPower, BonusMalus, LogDensity, VehBrand, VehGas, Region, AgeMalus]
  controls: [ExposureBand]                   # fitted, pinned at full year when pricing (D-014)
  significance: 0.05                         # backward elimination: drop factors with quasi-F p above this
  variance_bins: 20                          # bins of fitted mean for the variance-vs-mean check
  flat_amount_min_share: 0.02                # report claim amounts that recur in at least this share of claims

pure_premium:
  tweedie_power_sensitivity: [-0.1, 0.1]     # offsets around the power implied by the severity dispersion

benchmarks:
  numeric: [DrivAge, VehAge, VehPower, BonusMalus, LogDensity]
  categorical: [VehBrand, VehGas, Region]
  control: ExposureBand                      # ordinal feature; pinned at full year when pricing (D-012, D-018)
  lgbm:
    learning_rate: 0.08
    max_rounds: 3000
    early_stopping_rounds: 50
    n_search: 6                              # random configurations tried per model (grouped 5-fold CV)
    search_space:
      num_leaves: [7, 15, 31, 63]
      min_child_samples: [100, 300, 1000, 3000]
      reg_lambda: [0.0, 1.0, 10.0]
      colsample_bytree: [0.6, 0.8, 1.0]
      subsample: [0.7, 1.0]
    severity_search_space:                   # far less data: shallower, larger leaves
      num_leaves: [3, 7, 15]
      min_child_samples: [100, 300, 1000]
      reg_lambda: [1.0, 10.0, 50.0]
      colsample_bytree: [0.6, 1.0]
      subsample: [0.7, 1.0]
  rf:                                        # regularised defaults, not tuned (benchmark only)
    n_estimators: 200
    min_samples_leaf: 1000
    max_features: 0.5
    max_samples: 0.5

evaluation:
  n_bins: 10
  n_boot: 200                                # grouped bootstrap replicates on the holdout
  segments: [DrivAge, BonusMalus, LogDensity, VehAge, VehPower, VehBrand, Region]

explain:
  shap_sample: 50000                         # training rows used for SHAP and fold-stability attributions
  factors: [DrivAge, VehAge, VehPower, BonusMalus, LogDensity, VehBrand, VehGas, Region]
  monotone_increasing: [BonusMalus, LogDensity]   # factors a filed tariff would be expected to rate monotonically
  geography: [Region, LogDensity]            # potential socioeconomic proxies (fairness review)

pricing:
  # ---- ASSUMPTIONS (no price, lapse or expense data in freMTPL2; every value is varied in sensitivity) ----
  expense_ratio: 0.25                        # ASSUMPTION: expenses as a share of premium
  profit_margin: 0.05                        # ASSUMPTION: target margin as a share of premium
  current_tariff: one_factor_BonusMalus      # status quo the book is renewing from (D-023)
  reference_truth: blend                     # blend | glm | lgbm: "true" cost and competitor price (D-024)
  cap: 0.15                                  # max premium change vs current for capped strategies
  retention:                                 # ASSUMED logistic price-elasticity model, NOT fitted (D-025)
    base_rate: 0.85                          # renewal probability at no price change and market parity
    beta_change: -3.0                        # per unit log(new premium / current premium)
    beta_market: -4.0                        # per unit log(new premium / competitor premium)
  filable_glm:                               # strategy of own design (D-026)
    drop_factors: [Region]
    bonusmalus_bands: [50, 51, 58, 80, 95, 100, 115]   # 58-67 and 68-79 merged: monotone malus scale
  monte_carlo:
    runs: 5000
    systemic_sd: 0.05                        # ASSUMPTION: run-level frequency shock (trend / weather), lognormal sd
    seed_offset: 40
  sensitivity:
    elasticity_scale: [0.5, 1.0, 2.0]
    expense_ratio: [0.20, 0.25, 0.30]          # expenses actually incurred vs the 25% priced in
    cap: [0.05, 0.10, 0.15, 0.25]
    reference_truth: [blend, glm, lgbm]

exposure_analysis:
  # Exposure band edges in years (right-closed). 1/12 ~ one month.
  exposure_bands: [0.0, 0.0833, 0.25, 0.5, 0.75, 0.999, 1.0]
  # Small factor set used only to illustrate offset vs feature vs ignored exposure.
  demo_factors: [BonusMalus_band, DrivAge_band, Area]
  bonusmalus_bands: [50, 51, 60, 70, 80, 100, 230]
  drivage_bands: [17, 21, 26, 31, 41, 51, 61, 71, 100]
