# Single source of truth for paths, thresholds and seeds.
# Every number used by the pipeline lives here; see docs/decisions.md for why each value was chosen.

seed: 20261029

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  duckdb: data/processed/fremtpl2.duckdb
  manifest: data/raw_manifest.json
  reports_dir: reports
  tables_dir: reports/tables
  figures_dir: reports/figures
  artifacts_dir: artifacts

openml:
  freq_id: 41214   # freMTPL2freq: one row per policy(-period), exposure and claim count
  sev_id: 41215    # freMTPL2sev: one row per claim with its amount

rating_factors:
  categorical: [Area, VehBrand, VehGas, Region]
  numeric: [VehPower, VehAge, DrivAge, BonusMalus, Density]

cleaning:
  exposure_cap: 1.0              # policy years; the portfolio is observed for one calendar year
  # "severity_records": claim count = number of claims with an amount record (keeps frequency and
  # severity consistent for pure premium). "recorded": keep ClaimNb as supplied.
  claim_count_source: severity_records
  claim_count_cap: 4             # counts above this are capped (see decisions.md D-004)
  large_loss_quantile: 0.995     # individual claims are capped at this quantile of claim amounts

split:
  holdout_fraction: 0.20
  n_folds: 5

glm:
  # Banded numeric factors: left-closed lower edges, last band open-ended (see decisions.md D-009).
  bands:
    DrivAge: [18, 21, 26, 31, 41, 51, 61, 71]
    VehAge: [0, 1, 3, 6, 10, 13, 16, 20]
    VehPower: [4, 5, 6, 7, 8, 9, 10, 12]
    BonusMalus: [50, 51, 58, 68, 80, 95, 100, 115]
    LogDensity: [0, 3, 4, 5, 6, 7, 8, 9]     # ln(Density)
  categorical: [VehBrand, VehGas, Region]
  factors: [DrivAge, VehAge, VehPower, BonusMalus, LogDensity, VehBrand, VehGas, Region, AgeMalus]
  # Fitted but not charged: pinned at the reference level when pricing (D-012).
  controls:
    ExposureBand:
      source: exposure
      edges: [0.0, 0.0833, 0.25, 0.5, 0.75, 0.999, 1.0]
      reference: "(0.999, 1]"              # full-year cover
  candidate_factors: [Area]                  # tested by LR test against the main model (add-one)
  derived:
    AgeMalus:                                # driver-age band x malus flag (D-011)
      age_cuts: [18, 31, 61]
      all_age_labels: ["18-30", "31-60", "61+"]
      age_labels: ["18-30", "61+"]           # 31-60 with a malus stays in the base level (identifiability)
      malus_threshold: 50
  ci_level: 0.95

frequency:
  baseline_one_factor: BonusMalus
  significance: 0.05
  residual_seed_offset: 1                    # added to the global seed for randomised quantile residuals
  residual_sample: 50000                     # residuals plotted on a sample to keep figures light

exposure_analysis:
  # Exposure band edges in years (right-closed). 1/12 ~ one month.
  exposure_bands: [0.0, 0.0833, 0.25, 0.5, 0.75, 0.999, 1.0]
  # Small factor set used only to illustrate offset vs feature vs ignored exposure.
  demo_factors: [BonusMalus_band, DrivAge_band, Area]
  bonusmalus_bands: [50, 51, 60, 70, 80, 100, 230]
  drivage_bands: [17, 21, 26, 31, 41, 51, 61, 71, 100]
